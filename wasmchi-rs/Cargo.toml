[package]
name = "wasmchi"
version = "0.1.0"
edition = "2024"
description = "wasmchi compiler (Rust)"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
logos = "0.14"
wasm-encoder = "0.245"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
